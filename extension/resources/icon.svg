<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="g" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#f0247a"/>
      <stop offset="100%" stop-color="#8b1a3a"/>
    </linearGradient>
    <linearGradient id="t" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1a7a8a"/>
      <stop offset="100%" stop-color="#0d3d4d"/>
    </linearGradient>
  </defs>

  <!-- < bracket -->
  <polyline points="18,38 6,54 18,70"
    fill="none" stroke="url(#t)" stroke-width="7"
    stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- > bracket -->
  <polyline points="66,38 78,54 66,70"
    fill="none" stroke="url(#t)" stroke-width="7"
    stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Crystal gem -->
  <polygon points="36,22 55,20 59,66 42,92 33,66"  fill="url(#g)"/>
  <polygon points="36,22 28,38 28,70 33,66 36,22"  fill="#f94d94" opacity="0.8"/>
  <polygon points="55,20 64,36 64,70 59,66 55,20"  fill="#6a0f30" opacity="0.8"/>
  <polygon points="36,22 42,16 55,20 42,26"         fill="#f94d94" opacity="0.6"/>

  <!-- Slash accent top-right -->
  <line x1="57" y1="17" x2="72" y2="9"
        stroke="url(#t)" stroke-width="4" stroke-linecap="round"/>

  <!-- Gold star -->
  <g transform="translate(43,8)">
    <polygon points="0,-9 2,-2 9,-2 3,2 5,9 0,5 -5,9 -3,2 -9,-2 -2,-2"
      fill="#f5c518"/>
